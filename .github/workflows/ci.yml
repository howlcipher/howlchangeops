name: HowlChangeOps CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Download HowlFrame v0.1.0
      run: |
        mkdir -p ~/.local/bin
        wget -q https://github.com/howlcipher/howlframe/releases/download/v0.1.0/howlframe_v0.1.0_linux_amd64.tar.gz
        tar -xzf howlframe_v0.1.0_linux_amd64.tar.gz -C ~/.local/bin/
        chmod +x ~/.local/bin/howlframe
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build adapter
      run: |
        cd adapter
        go build -o ../howlchangeops
        cd ..
        ln -sf howlchangeops changeops

    - name: HowlFrame check and build
      run: |
        howlframe check src/howlchangeops.howl
        howlframe build src/howlchangeops.howl
        ln -sf howlchangeops.hfbc changeops.hfbc

    - name: Integration tests
      run: bash tests/integration_test.sh

    - name: Adversarial tests
      run: bash tests/adversarial_test.sh

    - name: Authority bypass tests
      run: bash tests/authority_bypass_test.sh

    - name: Verify SEO Metadata & Artifacts
      run: python3 scripts/test_seo.py
